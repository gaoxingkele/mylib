# Include inside the pilot TLS server block after checking these paths are free.
location = /hub/mcp {
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8822;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
}

location = /hub/view {
    proxy_pass http://127.0.0.1:8822;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}

# Enable this exact location when the corresponding service and host grant are ready.
location = /hub/feedback {
    proxy_pass http://127.0.0.1:8822;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}
