interface:
  display_name: "Skill-RSI"
  short_description: "Gate evolution of mylib review and writing skills under a frozen evaluator."
default_prompt: |
  Use Skill-RSI to propose, gate, admit, or reject changes to first-class
  review/writing skills in mylib. Change only one surface. Never mutate
  frozen evaluators, funding-probability bans, or patent hard gates.
  Prefer gene-bank cards over anonymous prompt rewrites.
